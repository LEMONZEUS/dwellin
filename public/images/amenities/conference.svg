<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Conference room with a long table, chairs and a wall screen">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b4268"/><stop offset="1" stop-color="#17263d"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2a43"/><stop offset="1" stop-color="#0b1424"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe0f5"/><stop offset="1" stop-color="#8fb0e0"/></linearGradient>
    <linearGradient id="tbl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f93b2"/><stop offset="1" stop-color="#52678a"/></linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#46699d"/><stop offset="1" stop-color="#22385c"/></linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#wall)"/>
  <rect y="300" width="800" height="180" fill="url(#floor)"/>
  <rect y="296" width="800" height="6" fill="#0e1a2c"/>

  <!-- window wall with a city skyline -->
  <g>
    <rect x="40" y="48" width="260" height="214" rx="4" fill="#0e1a2c"/>
    <rect x="48" y="56" width="244" height="198" fill="url(#sky)"/>
    <g fill="#35507a">
      <rect x="56" y="170" width="34" height="84"/><rect x="96" y="140" width="40" height="114"/>
      <rect x="142" y="186" width="30" height="68"/><rect x="178" y="120" width="44" height="134"/>
      <rect x="228" y="160" width="36" height="94"/><rect x="268" y="196" width="22" height="58"/>
    </g>
    <g fill="#c9d4e4" opacity="0.7">
      <rect x="104" y="150" width="6" height="6"/><rect x="118" y="150" width="6" height="6"/><rect x="104" y="166" width="6" height="6"/>
      <rect x="188" y="130" width="6" height="6"/><rect x="204" y="130" width="6" height="6"/><rect x="188" y="148" width="6" height="6"/><rect x="204" y="148" width="6" height="6"/>
    </g>
    <rect x="167" y="56" width="4" height="198" fill="#0e1a2c"/>
    <rect x="48" y="150" width="244" height="4" fill="#0e1a2c"/>
  </g>

  <!-- wall screen -->
  <rect x="400" y="62" width="340" height="190" rx="6" fill="#0b1424"/>
  <rect x="410" y="72" width="320" height="170" rx="2" fill="url(#scr)"/>
  <g fill="#c9d4e4" opacity="0.85">
    <rect x="432" y="94" width="120" height="10" rx="3"/>
    <rect x="432" y="116" width="200" height="6" rx="3" opacity="0.6"/>
    <rect x="432" y="130" width="170" height="6" rx="3" opacity="0.6"/>
  </g>
  <g fill="#f2b84b"><rect x="440" y="180" width="26" height="46" rx="2"/></g>
  <g fill="#8fb0e0"><rect x="476" y="162" width="26" height="64" rx="2"/><rect x="512" y="192" width="26" height="34" rx="2"/><rect x="548" y="148" width="26" height="78" rx="2"/></g>

  <!-- pendant lights -->
  <g stroke="#0e1a2c" stroke-width="2"><line x1="250" y1="0" x2="250" y2="30"/><line x1="400" y1="0" x2="400" y2="30"/><line x1="550" y1="0" x2="550" y2="30"/></g>
  <g fill="#f2b84b"><path d="M232 30h36l-6 16h-24z"/><path d="M382 30h36l-6 16h-24z"/><path d="M532 30h36l-6 16h-24z"/></g>

  <!-- chairs behind the table -->
  <g fill="#0e1a2c">
    <rect x="190" y="290" width="62" height="58" rx="12"/><rect x="290" y="290" width="62" height="58" rx="12"/>
    <rect x="390" y="290" width="62" height="58" rx="12"/><rect x="490" y="290" width="62" height="58" rx="12"/>
    <rect x="590" y="290" width="62" height="58" rx="12"/>
  </g>

  <!-- table -->
  <path d="M120 350 L680 350 L740 392 L60 392 Z" fill="url(#tbl)"/>
  <rect x="60" y="392" width="680" height="12" fill="#3d4f6f"/>
  <rect x="150" y="404" width="14" height="46" fill="#0e1a2c"/><rect x="636" y="404" width="14" height="46" fill="#0e1a2c"/>
  <!-- laptop, notebook and cups on the table -->
  <path d="M330 358 L410 358 L418 376 L322 376 Z" fill="#1b2b42"/>
  <rect x="338" y="340" width="64" height="22" rx="2" fill="#c9d4e4" opacity="0.9"/>
  <rect x="470" y="364" width="58" height="12" rx="2" fill="#f2b84b"/>
  <ellipse cx="590" cy="366" rx="10" ry="4" fill="#e8edf5"/><rect x="580" y="352" width="20" height="14" fill="#e8edf5"/>

  <!-- front chairs -->
  <g fill="#162338">
    <rect x="160" y="400" width="74" height="64" rx="14"/><rect x="330" y="404" width="74" height="64" rx="14"/>
    <rect x="500" y="404" width="74" height="64" rx="14"/><rect x="640" y="400" width="74" height="64" rx="14"/>
  </g>
</svg>
